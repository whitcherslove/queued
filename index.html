<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#121214" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Onest:wght@400;500;700&family=Montserrat:wght@800&display=swap" />
    <title>Queued</title>
    <link rel="icon" type="image/png" href="/icons/favicon-64.png" />
    <style>
      /* splash: QD drops in, its smile fills up like a loading bar; then UEUE squeezes in — QD becomes QUEUED, the smile stretches under it */
      #splash { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background: #121214; transition: opacity .35s ease, visibility .35s; }
      #splash.gone { opacity: 0; visibility: hidden; }
      #splash .w { display: inline-flex; flex-direction: column; align-items: center; }
      #splash .word { display: flex; align-items: flex-end; font-family: 'Montserrat', 'Arial', sans-serif; font-weight: 800; font-size: 58px; line-height: 1; letter-spacing: 1px;
        background: linear-gradient(#ffffff 30%, #DED6FF); -webkit-background-clip: text; background-clip: text; color: transparent; }
      #splash .q, #splash .d { display: inline-block; opacity: 0; transform: translateY(-18px); animation: sp-drop .38s cubic-bezier(.2,.9,.3,1.2) forwards; }
      #splash .d { animation-delay: .1s; }
      #splash .mid { display: inline-flex; overflow: hidden; max-width: 0; animation: sp-open .6s cubic-bezier(.6,0,.2,1) 1.25s forwards; }
      #splash .mid span { opacity: 0; animation: sp-fade .3s ease-out forwards; }
      #splash .mid span:nth-child(1) { animation-delay: 1.35s; } #splash .mid span:nth-child(2) { animation-delay: 1.43s; } #splash .mid span:nth-child(3) { animation-delay: 1.51s; } #splash .mid span:nth-child(4) { animation-delay: 1.59s; }
      #splash .smile-wrap { width: 100%; display: flex; justify-content: center; margin-top: 10px; }
      #splash .smile-box { width: 64%; animation: sp-wide .6s cubic-bezier(.6,0,.2,1) 1.25s forwards; }
      #splash .smile { display: block; width: 100%; height: 24px; overflow: visible; filter: drop-shadow(0 0 6px rgba(139,123,240,.55)); }
      #splash .smile .track { stroke: rgba(139,123,240,.22); }
      #splash .smile .fill { stroke-dasharray: 100; stroke-dashoffset: 100; animation: sp-load .8s cubic-bezier(.4,0,.2,1) .4s forwards; }
      @keyframes sp-drop { to { opacity: 1; transform: none; } }
      @keyframes sp-open { to { max-width: 5.2em; } }
      @keyframes sp-fade { to { opacity: 1; } }
      @keyframes sp-load { to { stroke-dashoffset: 0; } }
      @keyframes sp-wide { to { width: 80%; } }
      @media (prefers-color-scheme: light) { #splash { background: #f5f4f7; } #splash .word { background: linear-gradient(#17161A 30%, #4b3fa8); -webkit-background-clip: text; background-clip: text; } }
      @media (prefers-reduced-motion: reduce) { #splash .q, #splash .d, #splash .mid span { animation: none; opacity: 1; transform: none; } #splash .mid { animation: none; max-width: none; } #splash .smile .fill { animation: none; stroke-dashoffset: 0; } #splash .smile-box { animation: none; width: 80%; } }
    </style>
  </head>
  <body>
    <div id="splash" role="img" aria-label="Queued is loading">
      <div class="w" aria-hidden="true">
        <div class="word"><span class="q">Q</span><span class="mid"><span>U</span><span>E</span><span>U</span><span>E</span></span><span class="d">D</span></div>
        <div class="smile-wrap"><div class="smile-box"><svg class="smile" viewBox="0 0 100 24" preserveAspectRatio="none">
          <path class="track" d="M5 5 Q50 30 95 5" fill="none" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke" />
          <path class="fill" d="M5 5 Q50 30 95 5" pathLength="100" fill="none" stroke="#8B7BF0" stroke-width="7" stroke-linecap="round" vector-effect="non-scaling-stroke" />
        </svg></div></div>
      </div>
    </div>
    <div id="root"></div>
    <div class="rotate-hint" aria-hidden="true"><span>Turn your phone upright</span></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
